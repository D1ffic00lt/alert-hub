name: alert-hub-api-only

services:
  alert-hub:
    image: ${ALERT_HUB_API_IMAGE:-alert-hub-api:dev}
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
        BUILD_CREATED: ${BUILD_CREATED:-unknown}
        BUILD_COMPATIBILITY: ${BUILD_COMPATIBILITY:-dev}
    restart: ${ALERT_HUB_RESTART_POLICY:-unless-stopped}
    env_file:
      - ${ALERT_HUB_ENV_FILE:-.env}
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8080"
      DATABASE_URL: sqlite:////data/alert-hub.db
      UI_ENABLED: "false"
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
    ports:
      - "${ALERT_HUB_BIND_ADDRESS:-127.0.0.1}:${ALERT_HUB_HOST_PORT:-8080}:8080"
    volumes:
      - type: volume
        source: alert-hub-data
        target: /data
      - type: bind
        source: ${ALERT_HUB_SECRETS_DIR:-./runtime/secrets}
        target: /run/secrets
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [app]

networks:
  app: {}

volumes:
  alert-hub-data:
    name: ${ALERT_HUB_DATA_VOLUME:-alert-hub-data}
