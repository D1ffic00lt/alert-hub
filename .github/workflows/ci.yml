name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Repository policy and style
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install style tooling
        run: |
          npm --prefix frontend ci --ignore-scripts
          python -m pip install --disable-pip-version-check 'PyYAML>=6,<7' 'yamllint>=1.37,<2'
      - name: Prettier
        run: frontend/node_modules/.bin/prettier --check . --ignore-unknown
      - name: Markdown
        run: >-
          frontend/node_modules/.bin/markdownlint-cli2
          "**/*.md" "!frontend/node_modules/**" "!frontend/dist/**"
          "!.venv/**" "!backend/.venv/**"
      - name: YAML
        run: >-
          yamllint -c .yamllint.yaml
          .yamllint.yaml .github deploy
          docker-compose.yml
          docker-compose.api-only.yml
          docker-compose.split.yml
      - name: Workflow trust policy
        run: python deploy/scripts/check-ci-policy.py
      - name: Parse shell scripts
        run: |
          bash -n \
            deploy/scripts/alert-hub-backup \
            deploy/scripts/install-proxy-config.sh \
            deploy/scripts/ci-migrations.sh \
            deploy/scripts/check-no-secrets.sh \
            deploy/scripts/test-backup-tool.sh \
            deploy/scripts/test-deploy-vapid-preflight.sh \
            deploy/scripts/ci-container-smoke.sh \
            deploy/scripts/ci-image-matrix-smoke.sh \
            deploy/scripts/ci-three-node-failure.sh \
            deploy/scripts/host-readiness.sh \
            .github/deploy/scripts/docker-provision-node.sh \
            .github/deploy/scripts/docker-deploy-node.sh \
            .github/deploy/scripts/docker-rollback-node.sh \
            .github/deploy/scripts/docker-status-node.sh
          sh -n \
            docker-install.sh \
            backend/container/entrypoint.sh \
            frontend/container/entrypoint.sh \
            frontend/container/render-ui-runtime.sh
      - name: ShellCheck
        run: |
          shellcheck \
            deploy/scripts/alert-hub-backup \
            deploy/scripts/install-proxy-config.sh \
            deploy/scripts/ci-migrations.sh \
            deploy/scripts/check-no-secrets.sh \
            deploy/scripts/test-backup-tool.sh \
            deploy/scripts/test-deploy-vapid-preflight.sh \
            deploy/scripts/ci-container-smoke.sh \
            deploy/scripts/ci-image-matrix-smoke.sh \
            deploy/scripts/ci-three-node-failure.sh \
            deploy/scripts/host-readiness.sh \
            .github/deploy/scripts/docker-provision-node.sh \
            .github/deploy/scripts/docker-deploy-node.sh \
            .github/deploy/scripts/docker-rollback-node.sh \
            .github/deploy/scripts/docker-status-node.sh \
            docker-install.sh \
            backend/container/entrypoint.sh \
            frontend/container/entrypoint.sh \
            frontend/container/render-ui-runtime.sh
      - name: Dockerfile build checks
        run: |
          docker buildx build --check --file backend/Dockerfile backend
          docker buildx build --check --file frontend/Dockerfile frontend

  backend:
    name: Backend, coverage, migrations, and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[dev]'
      - name: Ruff format
        run: ruff format --check backend
      - name: Ruff lint
        run: ruff check backend
      - name: Deployment Python style
        run: |
          ruff format --check --config ruff.toml \
            deploy/scripts/check-codeql-sarif.py \
            deploy/scripts/check-ci-policy.py \
            deploy/scripts/check-openapi.py
          ruff check --config ruff.toml \
            deploy/scripts/check-codeql-sarif.py \
            deploy/scripts/check-ci-policy.py \
            deploy/scripts/check-openapi.py
      - name: Static typing
        run: mypy backend/alert_hub
      - name: Unit and integration tests with branch coverage
        working-directory: backend
        env:
          APP_ENV: test
        run: |
          pytest tests --cov=alert_hub --cov-report=term-missing --cov-report=xml:coverage.xml
          coverage report --format=markdown >>"${GITHUB_STEP_SUMMARY}"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage-${{ github.run_id }}
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Clean and previous-schema migrations
        env:
          APP_ENV: test
        run: bash deploy/scripts/ci-migrations.sh
      - name: OpenAPI contract
        env:
          APP_ENV: test
        run: python deploy/scripts/check-openapi.py

  frontend:
    name: Frontend lint, types, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit behavior tests and production build
        run: |
          npm test
          npm run build
      - name: Install browser for primary-path tests
        run: npx --no-install playwright install --with-deps chromium
      - name: Primary browser paths and accessibility smoke
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Dependency integrity and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Scan source tree for secret material
        run: bash deploy/scripts/check-no-secrets.sh
      - name: Audit Python environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[dev]'
          python -m pip check
          python -m pip_audit --local --cache-dir "${RUNNER_TEMP}/pip-audit"
      - name: Verify and audit Node dependency tree
        run: |
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend ls --all
          npm --prefix frontend audit --audit-level=high

  operations:
    name: Compose and recovery tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose models
        env:
          ALERT_HUB_ENV_FILE: ${{ github.workspace }}/.env.example
          ALERT_HUB_DATA_DIR: /tmp
          ALERT_HUB_SECRETS_DIR: /tmp
          ALERT_HUB_CI_ROOT: /tmp/alert-hub-ci-compose-validation
          ALERT_HUB_CI_SUBNET: 10.253.250.0/28
          ALERT_HUB_CI_RU_IP: 10.253.250.2
          ALERT_HUB_CI_NL_IP: 10.253.250.3
          ALERT_HUB_CI_DE_IP: 10.253.250.4
          ALERT_HUB_CI_SINK_IP: 10.253.250.5
          ALERT_HUB_API_IMAGE: alert-hub-api:ci
          ALERT_HUB_WEB_IMAGE: alert-hub-web:ci
          ALERT_HUB_EDGE_SUBNET: 10.253.251.0/29
          ALERT_HUB_API_IP: 10.253.251.2
          ALERT_HUB_WEB_IP: 10.253.251.3
          ALERT_HUB_API_HOST_PORT: 18081
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.split.yml config --quiet
          docker compose -f docker-compose.api-only.yml config --quiet
          MONITORING_NETWORK=existing-monitoring \
            docker compose -f docker-compose.yml -f deploy/docker-compose.monitoring.yaml config --quiet
          MONITORING_NETWORK=existing-monitoring \
            docker compose -f docker-compose.split.yml -f deploy/docker-compose.monitoring.yaml config --quiet
          MONITORING_NETWORK=existing-monitoring \
            docker compose -f docker-compose.api-only.yml -f deploy/docker-compose.monitoring.yaml config --quiet
          ALERT_HUB_API_IMAGE=ghcr.io/example/alert-hub-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            ALERT_HUB_WEB_IMAGE=ghcr.io/example/alert-hub-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            docker compose -f .github/deploy/docker-compose.production.yml config --quiet
          ALERT_HUB_API_IMAGE=ghcr.io/example/alert-hub-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            ALERT_HUB_WEB_IMAGE=ghcr.io/example/alert-hub-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            MONITORING_NETWORK=existing-monitoring \
            docker compose \
              -f .github/deploy/docker-compose.production.yml \
              -f .github/deploy/docker-compose.production-monitoring.yml \
              config --quiet
          docker compose -f deploy/docker-compose.ci-three-node.yaml config --quiet
      - name: Exercise deployment VAPID preflight
        run: bash deploy/scripts/test-deploy-vapid-preflight.sh
      - name: Exercise online backup and restore
        run: sudo bash deploy/scripts/test-backup-tool.sh

  api-image:
    name: Build backend-only API image
    needs: [repository-quality, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive API compatibility from the reviewed contract
        id: compatibility
        run: echo "value=openapi-sha256:$(sha256sum docs/openapi-contract.json | cut -d' ' -f1)" >>"${GITHUB_OUTPUT}"
      - name: Build API without frontend inputs or publishing
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --file backend/Dockerfile \
            --build-arg "BUILD_VERSION=sha-${GITHUB_SHA}" \
            --build-arg "BUILD_REVISION=${GITHUB_SHA}" \
            --build-arg BUILD_CREATED=1970-01-01T00:00:00Z \
            --build-arg "BUILD_COMPATIBILITY=${{ steps.compatibility.outputs.value }}" \
            --label org.alert-hub.component=api \
            --label "org.alert-hub.compatibility=${{ steps.compatibility.outputs.value }}" \
            --tag alert-hub-api:ci \
            backend
          [[ $(docker image inspect alert-hub-api:ci --format '{{index .Config.Labels "org.alert-hub.component"}}') == api ]]
          [[ $(docker image inspect alert-hub-api:ci --format '{{index .Config.Labels "org.alert-hub.compatibility"}}') == "${{ steps.compatibility.outputs.value }}" ]]
      - name: Export exact API image
        run: |
          docker image inspect alert-hub-api:ci --format '{{.Id}}' >alert-hub-api-ci.id
          docker save alert-hub-api:ci | gzip -9 >alert-hub-api-ci.tar.gz
          sha256sum alert-hub-api-ci.tar.gz >alert-hub-api-ci.tar.gz.sha256
      - name: Transfer exact API image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-api-image-${{ github.run_id }}
          path: |
            alert-hub-api-ci.tar.gz
            alert-hub-api-ci.tar.gz.sha256
            alert-hub-api-ci.id
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  web-image:
    name: Build standalone web image
    needs: [repository-quality, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive web compatibility from the reviewed contract
        id: compatibility
        run: echo "value=openapi-sha256:$(sha256sum docs/openapi-contract.json | cut -d' ' -f1)" >>"${GITHUB_OUTPUT}"
      - name: Build web without publishing
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --file frontend/Dockerfile \
            --build-arg "BUILD_VERSION=sha-${GITHUB_SHA}" \
            --build-arg "BUILD_REVISION=${GITHUB_SHA}" \
            --build-arg BUILD_CREATED=1970-01-01T00:00:00Z \
            --build-arg "BUILD_COMPATIBILITY=${{ steps.compatibility.outputs.value }}" \
            --label org.alert-hub.component=web \
            --label "org.alert-hub.compatibility=${{ steps.compatibility.outputs.value }}" \
            --tag alert-hub-web:ci \
            frontend
          [[ $(docker image inspect alert-hub-web:ci --format '{{index .Config.Labels "org.alert-hub.component"}}') == web ]]
          [[ $(docker image inspect alert-hub-web:ci --format '{{index .Config.Labels "org.alert-hub.compatibility"}}') == "${{ steps.compatibility.outputs.value }}" ]]
      - name: Export exact web image
        run: |
          docker image inspect alert-hub-web:ci --format '{{.Id}}' >alert-hub-web-ci.id
          docker save alert-hub-web:ci | gzip -9 >alert-hub-web-ci.tar.gz
          sha256sum alert-hub-web-ci.tar.gz >alert-hub-web-ci.tar.gz.sha256
      - name: Transfer exact web image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-web-image-${{ github.run_id }}
          path: |
            alert-hub-web-ci.tar.gz
            alert-hub-web-ci.tar.gz.sha256
            alert-hub-web-ci.id
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  container-integration:
    name: Exercise exact compatible API and web images
    needs: [api-image, web-image, security, operations]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tested-*-image-${{ github.run_id }}
          path: tested-images
          merge-multiple: true
      - name: Load and verify exact component images
        working-directory: tested-images
        run: |
          sha256sum --check alert-hub-api-ci.tar.gz.sha256
          sha256sum --check alert-hub-web-ci.tar.gz.sha256
          gzip --decompress --stdout alert-hub-api-ci.tar.gz | docker load
          gzip --decompress --stdout alert-hub-web-ci.tar.gz | docker load
          [[ $(docker image inspect alert-hub-api:ci --format '{{.Id}}') == $(cat alert-hub-api-ci.id) ]]
          [[ $(docker image inspect alert-hub-web:ci --format '{{.Id}}') == $(cat alert-hub-web-ci.id) ]]
          api_compatibility=$(docker image inspect alert-hub-api:ci --format '{{index .Config.Labels "org.alert-hub.compatibility"}}')
          web_compatibility=$(docker image inspect alert-hub-web:ci --format '{{index .Config.Labels "org.alert-hub.compatibility"}}')
          [[ "${api_compatibility}" == "${web_compatibility}" ]]
      - name: Component and compatible split-pair smoke
        run: >-
          bash deploy/scripts/ci-image-matrix-smoke.sh
          alert-hub-api:ci alert-hub-web:ci
      - name: Controlled three-node partition and recovery using API image
        run: bash deploy/scripts/ci-three-node-failure.sh alert-hub-api:ci

  candidate:
    name: Publish exact immutable API and web candidates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [container-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tested-*-image-${{ github.run_id }}
          path: tested-images
          merge-multiple: true
      - name: Load and verify the exact tested component images
        working-directory: tested-images
        run: |
          sha256sum --check alert-hub-api-ci.tar.gz.sha256
          sha256sum --check alert-hub-web-ci.tar.gz.sha256
          gzip --decompress --stdout alert-hub-api-ci.tar.gz | docker load
          gzip --decompress --stdout alert-hub-web-ci.tar.gz | docker load
          [[ $(docker image inspect alert-hub-api:ci --format '{{.Id}}') == $(cat alert-hub-api-ci.id) ]]
          [[ $(docker image inspect alert-hub-web:ci --format '{{.Id}}') == $(cat alert-hub-web-ci.id) ]]
          expected_compatibility=$(docker image inspect alert-hub-api:ci --format '{{index .Config.Labels "org.alert-hub.compatibility"}}')
          [[ "${expected_compatibility}" =~ ^openapi-sha256:[0-9a-f]{64}$ ]]
          [[ $(docker image inspect alert-hub-web:ci --format '{{index .Config.Labels "org.alert-hub.compatibility"}}') == "${expected_compatibility}" ]]
          for image in alert-hub-api:ci alert-hub-web:ci; do
            [[ $(docker image inspect "${image}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}') == "${GITHUB_SHA}" ]]
            [[ $(docker image inspect "${image}" --format '{{index .Config.Labels "org.alert-hub.compatibility"}}') == "${expected_compatibility}" ]]
          done
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Tag and push only the two tested candidates
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          tag="sha-${GITHUB_SHA}"
          api_candidate="${registry}/alert-hub-api:${tag}"
          web_candidate="${registry}/alert-hub-web:${tag}"

          candidate_state() {
            local candidate_ref=$1
            local expected_id=$2
            local inspect_error
            local inspect_message
            local remote_id
            inspect_error=$(mktemp)
            if docker manifest inspect "${candidate_ref}" >/dev/null 2>"${inspect_error}"; then
              rm -f "${inspect_error}"
              docker pull "${candidate_ref}" >&2
              remote_id=$(docker image inspect "${candidate_ref}" --format '{{.Id}}')
              if [[ "${remote_id}" != "${expected_id}" ]]; then
                printf 'Refusing to move immutable candidate tag: %s\n' "${candidate_ref}" >&2
                return 1
              fi
              printf 'existing\n'
              return 0
            fi
            inspect_message=$(tr '[:upper:]' '[:lower:]' <"${inspect_error}")
            rm -f "${inspect_error}"
            case "${inspect_message}" in
              *'manifest unknown'*|*'no such manifest'*|*'name unknown'*)
                printf 'absent\n'
                ;;
              *)
                printf '%s\n' "${inspect_message}" >&2
                printf 'Could not prove candidate tag is absent: %s\n' "${candidate_ref}" >&2
                return 1
                ;;
            esac
          }

          api_expected_id=$(cat tested-images/alert-hub-api-ci.id)
          web_expected_id=$(cat tested-images/alert-hub-web-ci.id)
          # Preflight both references before the first push. A rerun may reuse only
          # a byte-identical candidate; the sha-* tag is never allowed to move.
          api_state=$(candidate_state "${api_candidate}" "${api_expected_id}")
          web_state=$(candidate_state "${web_candidate}" "${web_expected_id}")

          if [[ "${api_state}" == absent ]]; then
            docker tag alert-hub-api:ci "${api_candidate}"
            [[ $(docker image inspect "${api_candidate}" --format '{{.Id}}') == "${api_expected_id}" ]]
            docker push "${api_candidate}"
          else
            printf 'Exact API candidate already exists; leaving it unchanged.\n'
          fi
          if [[ "${web_state}" == absent ]]; then
            docker tag alert-hub-web:ci "${web_candidate}"
            [[ $(docker image inspect "${web_candidate}" --format '{{.Id}}') == "${web_expected_id}" ]]
            docker push "${web_candidate}"
          else
            printf 'Exact web candidate already exists; leaving it unchanged.\n'
          fi
