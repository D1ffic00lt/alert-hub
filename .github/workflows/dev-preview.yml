name: Dev frontend preview

on:
  push:
    branches: [dev]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: alert-hub-dev-preview-ru
  cancel-in-progress: false

jobs:
  preview_policy:
    name: Check preview eligibility
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.decision.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decision
        name: Require manual launch when backend differs from main
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          should_run=true
          if [[ "${EVENT_NAME}" == "push" ]] && ! git diff --quiet origin/main HEAD -- backend/; then
            should_run=false
            printf '%s\n' '::notice::Automatic frontend preview skipped because backend differs from main; use workflow_dispatch from dev to run it explicitly.'
          fi
          printf 'should_run=%s\n' "${should_run}" >>"${GITHUB_OUTPUT}"

  build:
    name: Build and publish frontend preview
    needs: preview_policy
    if: needs.preview_policy.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      compatibility: ${{ steps.image.outputs.compatibility }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: image
        name: Build and publish immutable preview image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          repository="${registry}/alert-hub-web"
          tag="dev-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compatibility="openapi-sha256:$(sha256sum docs/openapi-contract.json | awk '{print $1}')"
          created=$(git show -s --format=%cI "${GITHUB_SHA}")
          metadata_file="${RUNNER_TEMP}/alert-hub-preview-metadata.json"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker buildx build \
            --file frontend/Dockerfile \
            --platform linux/amd64 \
            --build-arg "BUILD_VERSION=dev-${GITHUB_SHA}" \
            --build-arg "BUILD_REVISION=${GITHUB_SHA}" \
            --build-arg "BUILD_CREATED=${created}" \
            --build-arg "BUILD_COMPATIBILITY=${compatibility}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${repository}:${tag}" \
            --cache-from type=gha,scope=alert-hub-web-preview \
            --cache-to type=gha,mode=max,scope=alert-hub-web-preview \
            --metadata-file "${metadata_file}" \
            --push \
            frontend
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "${metadata_file}")
          printf 'image_ref=%s@%s\n' "${repository}" "${digest}" >>"${GITHUB_OUTPUT}"
          printf 'compatibility=%s\n' "${compatibility}" >>"${GITHUB_OUTPUT}"

  deploy_ru:
    name: Deploy preview to RU
    needs: build
    runs-on: [self-hosted, alert-hub-ru]
    environment:
      name: preview-ru
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy through the pre-provisioned root-owned preview boundary
        env:
          NODE_NAME: ru
          ALERT_HUB_PREVIEW_IMAGE: ${{ needs.build.outputs.image_ref }}
          ALERT_HUB_PREVIEW_REVISION: ${{ github.sha }}
          ALERT_HUB_PREVIEW_COMPATIBILITY: ${{ needs.build.outputs.compatibility }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APP_NAME: ${{ vars.PREVIEW_APP_NAME || vars.APP_NAME }}
        run: |
          set -Eeuo pipefail
          for required in NODE_NAME ALERT_HUB_PREVIEW_IMAGE ALERT_HUB_PREVIEW_REVISION ALERT_HUB_PREVIEW_COMPATIBILITY GHCR_TOKEN GITHUB_ACTOR GITHUB_REPOSITORY; do
            [[ -n ${!required} ]] || { printf 'Required protected value %s is missing\n' "${required}" >&2; exit 2; }
          done
          sudo --preserve-env=NODE_NAME,ALERT_HUB_PREVIEW_IMAGE,ALERT_HUB_PREVIEW_REVISION,ALERT_HUB_PREVIEW_COMPATIBILITY,GHCR_TOKEN,GITHUB_ACTOR,GITHUB_REPOSITORY,APP_NAME /usr/local/sbin/docker-deploy-preview-node.sh
