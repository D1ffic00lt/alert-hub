name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version as vX.Y.Z or X.Y.Z
        type: string
        required: false
        default: v0.1.5

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION_INPUT: ${{ inputs.version }}

jobs:
  release:
    name: Test, publish, and attest compatible API and web images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and source revision
        run: |
          backend_version=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')
          frontend_version=$(jq -er '.version' frontend/package.json)
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            requested_version=${RELEASE_VERSION_INPUT:-${backend_version}}
          else
            requested_version=${GITHUB_REF_NAME}
          fi
          release_version="v${requested_version#v}"
          [[ "${release_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          printf 'RELEASE_VERSION=%s\n' "${release_version}" >>"${GITHUB_ENV}"
          git show-ref --verify --quiet refs/remotes/origin/main
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            [[ "${GITHUB_REF}" == refs/heads/main ]]
            [[ "${GITHUB_SHA}" == "$(git rev-parse refs/remotes/origin/main)" ]]
            if git rev-parse --verify --quiet "refs/tags/${release_version}^{commit}"; then
              [[ "$(git rev-parse "refs/tags/${release_version}^{commit}")" == "${GITHUB_SHA}" ]]
            fi
          else
            tag_commit=$(git rev-parse "${release_version}^{commit}")
            [[ "${tag_commit}" == "${GITHUB_SHA}" ]]
            git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main
          fi
          [[ "${release_version}" == "v${backend_version}" ]]
          [[ "${release_version}" == "v${frontend_version}" ]]
      - name: Derive release compatibility from the reviewed API contract
        run: echo "ALERT_HUB_COMPATIBILITY=openapi-sha256:$(sha256sum docs/openapi-contract.json | cut -d' ' -f1)" >>"${GITHUB_ENV}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install release test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[dev]'
          npm --prefix frontend ci
          npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Run complete source and recovery gates
        env:
          APP_ENV: test
        run: |
          make quality
          make security-check
          make operations-check
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Resolve existing immutable release images
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

          verify_release_image() {
            local image=$1
            local component=$2
            local actual
            while IFS='=' read -r label expected; do
              actual=$(docker image inspect "${image}" --format "{{index .Config.Labels \"${label}\"}}")
              [[ "${actual}" == "${expected}" ]] || {
                printf 'Refusing incompatible immutable release image %s: label %s mismatch\n' \
                  "${image}" "${label}" >&2
                return 1
              }
            done <<EOF
          org.alert-hub.component=${component}
          org.opencontainers.image.version=${RELEASE_VERSION}
          org.opencontainers.image.revision=${GITHUB_SHA}
          org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          org.alert-hub.compatibility=${ALERT_HUB_COMPATIBILITY}
          EOF
            if [[ "${component}" == api ]]; then
              actual=$(docker image inspect "${image}" --format '{{index .Config.Labels "org.alert-hub.schema-compatibility"}}')
              [[ "${actual}" == n-1-expand-contract ]] || {
                printf 'Refusing incompatible immutable release image %s: API schema compatibility mismatch\n' \
                  "${image}" >&2
                return 1
              }
            fi
            [[ $(docker image inspect "${image}" --format '{{.Os}}/{{.Architecture}}') == linux/amd64 ]]
          }

          resolve_release_image() {
            local component=$1
            local repository=$2
            local local_image=$3
            local state_file=$4
            local release_ref="${repository}:${RELEASE_VERSION}"
            local inspect_error
            local inspect_message
            inspect_error=$(mktemp)
            if docker manifest inspect "${release_ref}" >/dev/null 2>"${inspect_error}"; then
              rm -f -- "${inspect_error}"
              docker pull "${release_ref}" >/dev/null
              verify_release_image "${release_ref}" "${component}"
              docker tag "${release_ref}" "${local_image}"
              printf 'existing\n' >"${state_file}"
              return 0
            fi
            inspect_message=$(tr '[:upper:]' '[:lower:]' <"${inspect_error}")
            rm -f -- "${inspect_error}"
            case "${inspect_message}" in
              *'manifest unknown'*|*'no such manifest'*|*'name unknown'*)
                printf 'absent\n' >"${state_file}"
                ;;
              *)
                printf 'Could not prove release tag is absent: %s\n' "${release_ref}" >&2
                return 1
                ;;
            esac
          }

          resolve_release_image api "${registry}/alert-hub-api" \
            alert-hub-api:release release-api.state
          resolve_release_image web "${registry}/alert-hub-web" \
            alert-hub-web:release release-web.state
      - name: Build each missing release image exactly once
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          created_epoch=$(git show -s --format=%ct "${GITHUB_SHA}")
          created=$(date -u --date="@${created_epoch}" +%Y-%m-%dT%H:%M:%SZ)
          printf 'RELEASE_CREATED=%s\n' "${created}" >>"${GITHUB_ENV}"
          export SOURCE_DATE_EPOCH="${created_epoch}"
          common_args=(
            --platform linux/amd64
            --build-arg "BUILD_VERSION=${RELEASE_VERSION}"
            --build-arg "BUILD_REVISION=${GITHUB_SHA}"
            --build-arg "BUILD_CREATED=${created}"
            --build-arg "BUILD_COMPATIBILITY=${ALERT_HUB_COMPATIBILITY}"
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --label "org.alert-hub.compatibility=${ALERT_HUB_COMPATIBILITY}"
          )
          if [[ $(cat release-api.state) == absent ]]; then
            docker build \
              "${common_args[@]}" \
              --file backend/Dockerfile \
              --label org.alert-hub.component=api \
              --tag alert-hub-api:release \
              backend
          else
            [[ $(cat release-api.state) == existing ]]
            printf 'Reusing the existing immutable API image.\n'
          fi
          if [[ $(cat release-web.state) == absent ]]; then
            docker build \
              "${common_args[@]}" \
              --file frontend/Dockerfile \
              --label org.alert-hub.component=web \
              --tag alert-hub-web:release \
              frontend
          else
            [[ $(cat release-web.state) == existing ]]
            printf 'Reusing the existing immutable web image.\n'
          fi
          docker image inspect alert-hub-api:release --format '{{.Id}}' >release-api-image.id
          docker image inspect alert-hub-web:release --format '{{.Id}}' >release-web-image.id
          [[ $(docker image inspect alert-hub-api:release --format '{{index .Config.Labels "org.alert-hub.component"}}') == api ]]
          [[ $(docker image inspect alert-hub-web:release --format '{{index .Config.Labels "org.alert-hub.component"}}') == web ]]
          for image in alert-hub-api:release alert-hub-web:release; do
            [[ $(docker image inspect "${image}" --format '{{index .Config.Labels "org.opencontainers.image.version"}}') == "${RELEASE_VERSION}" ]]
            [[ $(docker image inspect "${image}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}') == "${GITHUB_SHA}" ]]
            [[ $(docker image inspect "${image}" --format '{{index .Config.Labels "org.alert-hub.compatibility"}}') == "${ALERT_HUB_COMPATIBILITY}" ]]
          done
      - name: Exercise exact component images and compatible split pair
        run: |
          bash deploy/scripts/ci-image-matrix-smoke.sh \
            alert-hub-api:release alert-hub-web:release
          bash deploy/scripts/ci-three-node-failure.sh alert-hub-api:release
          [[ $(docker image inspect alert-hub-api:release --format '{{.Id}}') == $(cat release-api-image.id) ]]
          [[ $(docker image inspect alert-hub-web:release --format '{{.Id}}') == $(cat release-web-image.id) ]]
      - name: Generate API image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: alert-hub-api:release
          format: spdx-json
          output-file: release-api-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate web image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: alert-hub-web:release
          format: spdx-json
          output-file: release-web-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Normalize release SBOM identity deterministically
        run: |
          normalize_sbom() {
            local component=$1
            local source_file=$2
            local temporary
            temporary=$(mktemp)
            jq -S \
              --arg created "${RELEASE_CREATED}" \
              --arg namespace \
                "https://github.com/${GITHUB_REPOSITORY}/releases/${RELEASE_VERSION}/${component}-sbom" \
              '.creationInfo.created = $created | .documentNamespace = $namespace' \
              "${source_file}" >"${temporary}"
            mv -- "${temporary}" "${source_file}"
          }
          normalize_sbom api release-api-sbom.spdx.json
          normalize_sbom web release-web-sbom.spdx.json
      - name: Create the immutable release tag for a manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_VERSION}^{commit}"; then
            [[ "$(git rev-parse "refs/tags/${RELEASE_VERSION}^{commit}")" == "${GITHUB_SHA}" ]]
            exit 0
          fi
          tag_object=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f "tag=${RELEASE_VERSION}" \
            -f "message=Alert Hub ${RELEASE_VERSION}" \
            -f "object=${GITHUB_SHA}" \
            -f type=commit \
            --jq .sha)
          [[ "${tag_object}" =~ ^[0-9a-f]{40}$ ]]
          # A ref created with GITHUB_TOKEN does not trigger a second push workflow;
          # this run deliberately continues with publication of the tested artifacts.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${RELEASE_VERSION}" \
            -f "sha=${tag_object}" >/dev/null
      - name: Push only the exact tested release images
        id: publish
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

          assert_release_ref_absent() {
            local release_ref=$1
            local inspect_error
            local inspect_message
            inspect_error=$(mktemp)
            if docker manifest inspect "${release_ref}" >/dev/null 2>"${inspect_error}"; then
              rm -f -- "${inspect_error}"
              printf 'Refusing to move immutable release tag: %s\n' "${release_ref}" >&2
              return 1
            fi
            inspect_message=$(tr '[:upper:]' '[:lower:]' <"${inspect_error}")
            rm -f -- "${inspect_error}"
            case "${inspect_message}" in
              *'manifest unknown'*|*'no such manifest'*|*'name unknown'*) return 0 ;;
              *)
                printf 'Could not prove release tag is absent: %s\n' "${release_ref}" >&2
                return 1
                ;;
            esac
          }

          repository_digest() {
            local release_ref=$1
            local repository=$2
            local expected_id=$3
            local remote_id
            local repo_digests
            local repo_digest
            local candidate
            local digest=''
            docker pull "${release_ref}" >/dev/null
            remote_id=$(docker image inspect "${release_ref}" --format '{{.Id}}')
            [[ "${remote_id}" == "${expected_id}" ]] || {
              printf 'Refusing to move immutable release tag: %s changed during publication\n' \
                "${release_ref}" >&2
              return 1
            }
            repo_digests=$(docker image inspect "${release_ref}" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}')
            while IFS= read -r repo_digest; do
              case "${repo_digest}" in
                "${repository}@"sha256:*)
                  candidate=${repo_digest#"${repository}@"}
                  [[ "${candidate}" =~ ^sha256:[0-9a-f]{64}$ ]] || continue
                  [[ -z "${digest}" || "${digest}" == "${candidate}" ]] || {
                    printf 'Multiple digests found for exact repository: %s\n' \
                      "${repository}" >&2
                    return 1
                  }
                  digest=${candidate}
                  ;;
              esac
            done <<<"${repo_digests}"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s\n' "${digest}"
          }

          push_exact() {
            local component=$1
            local local_image=$2
            local repository=$3
            local id_file=$4
            local state_file=$5
            local release_ref="${repository}:${RELEASE_VERSION}"
            local expected_id
            local state
            local digest
            expected_id=$(cat "${id_file}")
            state=$(cat "${state_file}")
            if [[ "${state}" == absent ]]; then
              assert_release_ref_absent "${release_ref}"
              docker tag "${local_image}" "${release_ref}"
              [[ $(docker image inspect "${release_ref}" --format '{{.Id}}') == "${expected_id}" ]]
              docker push "${release_ref}"
            else
              [[ "${state}" == existing ]]
              printf 'Exact release image already exists; leaving %s unchanged.\n' "${release_ref}"
            fi
            digest=$(repository_digest "${release_ref}" "${repository}" "${expected_id}")
            printf '%s_name=%s\n' "${component}" "${repository}" >>"${GITHUB_OUTPUT}"
            printf '%s_digest=%s\n' "${component}" "${digest}" >>"${GITHUB_OUTPUT}"
            printf '%s_ref=%s@%s\n' "${component}" "${repository}" "${digest}" >>"${GITHUB_OUTPUT}"
          }

          push_exact api alert-hub-api:release "${registry}/alert-hub-api" release-api-image.id release-api.state
          push_exact web alert-hub-web:release "${registry}/alert-hub-web" release-web-image.id release-web.state
      - name: Create and validate release image manifest
        env:
          API_NAME: ${{ steps.publish.outputs.api_name }}
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          API_REF: ${{ steps.publish.outputs.api_ref }}
          WEB_NAME: ${{ steps.publish.outputs.web_name }}
          WEB_DIGEST: ${{ steps.publish.outputs.web_digest }}
          WEB_REF: ${{ steps.publish.outputs.web_ref }}
        run: |
          jq -n \
            --arg version "${RELEASE_VERSION}" \
            --arg revision "${GITHUB_SHA}" \
            --arg compatibility "${ALERT_HUB_COMPATIBILITY}" \
            --arg api_name "${API_NAME}" \
            --arg api_digest "${API_DIGEST}" \
            --arg api_ref "${API_REF}" \
            --arg web_name "${WEB_NAME}" \
            --arg web_digest "${WEB_DIGEST}" \
            --arg web_ref "${WEB_REF}" \
            '{
              schema_version: 1,
              version: $version,
              revision: $revision,
              compatibility: $compatibility,
              images: {
                api: {
                  component: "api", version: $version, revision: $revision,
                  compatibility: $compatibility, name: $api_name,
                  digest: $api_digest, reference: $api_ref
                },
                web: {
                  component: "web", version: $version, revision: $revision,
                  compatibility: $compatibility, name: $web_name,
                  digest: $web_digest, reference: $web_ref
                }
              },
              compatible_pairs: [{
                name: "split",
                api: $api_ref,
                web: $web_ref,
                compatibility: $compatibility
              }]
            }' >release-manifest.json
          jq -e '
            . as $root |
            .schema_version == 1 and
            (.version | test("^v[0-9]+\\.[0-9]+\\.[0-9]+")) and
            (.revision | test("^[0-9a-f]{40}$")) and
            (.compatibility | test("^openapi-sha256:[0-9a-f]{64}$")) and
            ((.images | keys) == ["api", "web"]) and
            ([.images.api, .images.web] | all(
              (.version == $root.version) and
              (.revision == $root.revision) and
              (.compatibility == $root.compatibility) and
              (.digest | test("^sha256:[0-9a-f]{64}$")) and
              (.reference == (.name + "@" + .digest))
            )) and
            (.compatible_pairs | length == 1) and
            (.compatible_pairs[0].api == .images.api.reference) and
            (.compatible_pairs[0].web == .images.web.reference) and
            (.compatible_pairs[0].compatibility == .compatibility)
          ' release-manifest.json >/dev/null
          sha256sum release-manifest.json >release-manifest.json.sha256
      - name: Attest API image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.api_name }}
          subject-digest: ${{ steps.publish.outputs.api_digest }}
          push-to-registry: true
      - name: Attest web image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.web_name }}
          subject-digest: ${{ steps.publish.outputs.web_digest }}
          push-to-registry: true
      - name: Publish or verify the exact GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fetch_release() {
            local error_file
            local pages_file
            local matches_file
            local match_count
            local status
            error_file=$(mktemp)
            pages_file=$(mktemp)
            matches_file=$(mktemp)
            if gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              >"${pages_file}" 2>"${error_file}"; then
              jq -s --arg version "${RELEASE_VERSION}" \
                'add | map(select(.tag_name == $version))' \
                "${pages_file}" >"${matches_file}"
              match_count=$(jq 'length' "${matches_file}")
              if [[ "${match_count}" == 1 ]]; then
                jq '.[0]' "${matches_file}" >release-state.json
                rm -f -- "${error_file}" "${pages_file}" "${matches_file}"
                return 0
              fi
              if [[ "${match_count}" == 0 ]]; then
                rm -f -- "${error_file}" "${pages_file}" "${matches_file}"
                return 4
              fi
              printf 'Multiple GitHub Releases use tag %s\n' "${RELEASE_VERSION}" >&2
              rm -f -- "${error_file}" "${pages_file}" "${matches_file}"
              return 1
            else
              status=$?
            fi
            cat "${error_file}" >&2
            rm -f -- "${error_file}" "${pages_file}" "${matches_file}"
            return "${status}"
          }

          verify_uploaded_asset() {
            local local_file=$1
            local asset_name=$2
            local asset_count
            local asset_id
            local asset_state
            local downloaded
            asset_count=$(jq --arg name "${asset_name}" \
              '[.assets[] | select(.name == $name)] | length' release-state.json)
            [[ "${asset_count}" == 1 ]] || {
              printf 'Expected exactly one release asset named %s\n' "${asset_name}" >&2
              return 1
            }
            asset_id=$(jq -r --arg name "${asset_name}" \
              '.assets[] | select(.name == $name) | .id' release-state.json)
            asset_state=$(jq -r --arg name "${asset_name}" \
              '.assets[] | select(.name == $name) | .state' release-state.json)
            [[ "${asset_id}" =~ ^[0-9]+$ && "${asset_state}" == uploaded ]]
            downloaded=$(mktemp)
            if ! gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >"${downloaded}"; then
              rm -f -- "${downloaded}"
              return 1
            fi
            if ! cmp --silent "${local_file}" "${downloaded}"; then
              rm -f -- "${downloaded}"
              printf 'Refusing to replace non-matching release asset: %s\n' \
                "${asset_name}" >&2
              return 1
            fi
            rm -f -- "${downloaded}"
          }

          ensure_release_asset() {
            local local_file=$1
            local asset_name=$2
            local display_label=$3
            local asset_count
            local asset_id
            local asset_state
            local auth_config
            local release_id
            local uploaded_asset
            local updated_release
            asset_count=$(jq --arg name "${asset_name}" \
              '[.assets[] | select(.name == $name)] | length' release-state.json)
            [[ "${asset_count}" -le 1 ]] || {
              printf 'Duplicate release assets named %s\n' "${asset_name}" >&2
              return 1
            }
            if [[ "${asset_count}" == 1 ]]; then
              asset_id=$(jq -r --arg name "${asset_name}" \
                '.assets[] | select(.name == $name) | .id' release-state.json)
              asset_state=$(jq -r --arg name "${asset_name}" \
                '.assets[] | select(.name == $name) | .state' release-state.json)
              if [[ "${asset_state}" == uploaded ]]; then
                verify_uploaded_asset "${local_file}" "${asset_name}"
                return 0
              fi
              [[ $(jq -r '.draft' release-state.json) == true ]]
              [[ "${asset_id}" =~ ^[0-9]+$ ]]
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
              updated_release=$(mktemp)
              jq --argjson asset_id "${asset_id}" \
                '.assets |= map(select(.id != $asset_id))' \
                release-state.json >"${updated_release}"
              mv -- "${updated_release}" release-state.json
            fi
            [[ $(jq -r '.draft' release-state.json) == true ]] || {
              printf 'Published release is missing required asset: %s\n' "${asset_name}" >&2
              return 1
            }
            release_id=$(jq -r '.id' release-state.json)
            [[ "${release_id}" =~ ^[0-9]+$ ]]
            auth_config=$(mktemp)
            chmod 600 "${auth_config}"
            printf 'header = "Authorization: Bearer %s"\n' "${GH_TOKEN}" >"${auth_config}"
            uploaded_asset=$(mktemp)
            if ! curl --fail-with-body --silent --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --config "${auth_config}" \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header 'Content-Type: application/octet-stream' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary "@${local_file}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset_name}&label=${display_label}" \
              >"${uploaded_asset}"; then
              rm -f -- "${auth_config}" "${uploaded_asset}"
              return 1
            fi
            rm -f -- "${auth_config}"
            jq -e --arg name "${asset_name}" \
              '.name == $name and .state == "uploaded" and (.id | type == "number")' \
              "${uploaded_asset}" >/dev/null
            updated_release=$(mktemp)
            jq -s '.[0].assets += [.[1]] | .[0]' \
              release-state.json "${uploaded_asset}" >"${updated_release}"
            mv -- "${updated_release}" release-state.json
            rm -f -- "${uploaded_asset}"
            verify_uploaded_asset "${local_file}" "${asset_name}"
          }

          if fetch_release; then
            :
          else
            fetch_status=$?
            [[ "${fetch_status}" == 4 ]] || exit "${fetch_status}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f "tag_name=${RELEASE_VERSION}" \
              -f "target_commitish=${GITHUB_SHA}" \
              -f "name=Alert Hub ${RELEASE_VERSION}" \
              -F draft=true \
              -F prerelease=false \
              -F generate_release_notes=true \
              >release-state.json
          fi

          jq -e \
            --arg version "${RELEASE_VERSION}" \
            --arg title "Alert Hub ${RELEASE_VERSION}" \
            '.tag_name == $version and .name == $title and (.prerelease | not)' \
            release-state.json >/dev/null

          ensure_release_asset \
            release-manifest.json release-manifest.json release-manifest.json
          ensure_release_asset \
            release-manifest.json.sha256 release-manifest.json.sha256 release-manifest.json.sha256
          ensure_release_asset \
            release-api-sbom.spdx.json release-api-sbom.spdx.json api-sbom.spdx.json
          ensure_release_asset \
            release-web-sbom.spdx.json release-web-sbom.spdx.json web-sbom.spdx.json

          jq -e '
            ([.assets[].name] | sort) == [
              "release-api-sbom.spdx.json",
              "release-manifest.json",
              "release-manifest.json.sha256",
              "release-web-sbom.spdx.json"
            ]
          ' release-state.json >/dev/null
          if [[ $(jq -r '.draft' release-state.json) == true ]]; then
            release_id=$(jq -r '.id' release-state.json)
            [[ "${release_id}" =~ ^[0-9]+$ ]]
            published_release=$(mktemp)
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false >"${published_release}"
            mv -- "${published_release}" release-state.json
          fi
          jq -e '.draft == false' release-state.json >/dev/null
