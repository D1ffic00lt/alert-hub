name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, publish, and attest compatible API and web images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          tag_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main
      - name: Derive release compatibility from the reviewed API contract
        run: echo "ALERT_HUB_COMPATIBILITY=openapi-sha256:$(sha256sum docs/openapi-contract.json | cut -d' ' -f1)" >>"${GITHUB_ENV}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install release test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[dev]'
          npm --prefix frontend ci
          npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Run complete source and recovery gates
        env:
          APP_ENV: test
        run: |
          make quality
          make security-check
          make operations-check
      - name: Build each release image exactly once
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          common_args=(
            --platform linux/amd64
            --build-arg "BUILD_VERSION=${GITHUB_REF_NAME}"
            --build-arg "BUILD_REVISION=${GITHUB_SHA}"
            --build-arg "BUILD_CREATED=${created}"
            --build-arg "BUILD_COMPATIBILITY=${ALERT_HUB_COMPATIBILITY}"
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --label "org.alert-hub.compatibility=${ALERT_HUB_COMPATIBILITY}"
          )
          docker build \
            "${common_args[@]}" \
            --file backend/Dockerfile \
            --label org.alert-hub.component=api \
            --tag alert-hub-api:release \
            backend
          docker build \
            "${common_args[@]}" \
            --file frontend/Dockerfile \
            --label org.alert-hub.component=web \
            --tag alert-hub-web:release \
            frontend
          docker image inspect alert-hub-api:release --format '{{.Id}}' >release-api-image.id
          docker image inspect alert-hub-web:release --format '{{.Id}}' >release-web-image.id
          [[ $(docker image inspect alert-hub-api:release --format '{{index .Config.Labels "org.alert-hub.component"}}') == api ]]
          [[ $(docker image inspect alert-hub-web:release --format '{{index .Config.Labels "org.alert-hub.component"}}') == web ]]
          for image in alert-hub-api:release alert-hub-web:release; do
            [[ $(docker image inspect "${image}" --format '{{index .Config.Labels "org.opencontainers.image.version"}}') == "${GITHUB_REF_NAME}" ]]
            [[ $(docker image inspect "${image}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}') == "${GITHUB_SHA}" ]]
            [[ $(docker image inspect "${image}" --format '{{index .Config.Labels "org.alert-hub.compatibility"}}') == "${ALERT_HUB_COMPATIBILITY}" ]]
          done
      - name: Exercise exact component images and compatible split pair
        run: |
          bash deploy/scripts/ci-image-matrix-smoke.sh \
            alert-hub-api:release alert-hub-web:release
          bash deploy/scripts/ci-three-node-failure.sh alert-hub-api:release
          [[ $(docker image inspect alert-hub-api:release --format '{{.Id}}') == $(cat release-api-image.id) ]]
          [[ $(docker image inspect alert-hub-web:release --format '{{.Id}}') == $(cat release-web-image.id) ]]
      - name: Generate API image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: alert-hub-api:release
          format: spdx-json
          output-file: release-api-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate web image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: alert-hub-web:release
          format: spdx-json
          output-file: release-web-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Push only the exact tested release images
        id: publish
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

          assert_tag_absent() {
            release_ref=$1
            inspect_error=$(mktemp)
            if docker manifest inspect "${release_ref}" >/dev/null 2>"${inspect_error}"; then
              rm -f -- "${inspect_error}"
              printf 'Refusing to move immutable release tag: %s already exists\n' "${release_ref}" >&2
              exit 1
            fi
            inspect_message=$(tr '[:upper:]' '[:lower:]' <"${inspect_error}")
            rm -f -- "${inspect_error}"
            case "${inspect_message}" in
              *'manifest unknown'*|*'no such manifest'*|*'not found'*) ;;
              *)
                printf 'Could not prove release tag is absent: %s\n' "${release_ref}" >&2
                exit 1
                ;;
            esac
          }

          push_exact() {
            component=$1
            local_image=$2
            repository=$3
            id_file=$4
            release_ref="${repository}:${GITHUB_REF_NAME}"
            expected_id=$(cat "${id_file}")
            assert_tag_absent "${release_ref}"
            docker tag "${local_image}" "${release_ref}"
            [[ $(docker image inspect "${release_ref}" --format '{{.Id}}') == "${expected_id}" ]]
            push_output=$(docker push "${release_ref}")
            printf '%s\n' "${push_output}"
            digest=$(printf '%s\n' "${push_output}" \
              | sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' \
              | tail -n 1)
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s_name=%s\n' "${component}" "${repository}" >>"${GITHUB_OUTPUT}"
            printf '%s_digest=%s\n' "${component}" "${digest}" >>"${GITHUB_OUTPUT}"
            printf '%s_ref=%s@%s\n' "${component}" "${repository}" "${digest}" >>"${GITHUB_OUTPUT}"
          }

          # Check both destinations before the first push so an existing web tag
          # cannot leave a newly published API-only partial release.
          assert_tag_absent "${registry}/alert-hub-api:${GITHUB_REF_NAME}"
          assert_tag_absent "${registry}/alert-hub-web:${GITHUB_REF_NAME}"
          push_exact api alert-hub-api:release "${registry}/alert-hub-api" release-api-image.id
          push_exact web alert-hub-web:release "${registry}/alert-hub-web" release-web-image.id
      - name: Create and validate release image manifest
        env:
          API_NAME: ${{ steps.publish.outputs.api_name }}
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          API_REF: ${{ steps.publish.outputs.api_ref }}
          WEB_NAME: ${{ steps.publish.outputs.web_name }}
          WEB_DIGEST: ${{ steps.publish.outputs.web_digest }}
          WEB_REF: ${{ steps.publish.outputs.web_ref }}
        run: |
          jq -n \
            --arg version "${GITHUB_REF_NAME}" \
            --arg revision "${GITHUB_SHA}" \
            --arg compatibility "${ALERT_HUB_COMPATIBILITY}" \
            --arg api_name "${API_NAME}" \
            --arg api_digest "${API_DIGEST}" \
            --arg api_ref "${API_REF}" \
            --arg web_name "${WEB_NAME}" \
            --arg web_digest "${WEB_DIGEST}" \
            --arg web_ref "${WEB_REF}" \
            '{
              schema_version: 1,
              version: $version,
              revision: $revision,
              compatibility: $compatibility,
              images: {
                api: {
                  component: "api", version: $version, revision: $revision,
                  compatibility: $compatibility, name: $api_name,
                  digest: $api_digest, reference: $api_ref
                },
                web: {
                  component: "web", version: $version, revision: $revision,
                  compatibility: $compatibility, name: $web_name,
                  digest: $web_digest, reference: $web_ref
                }
              },
              compatible_pairs: [{
                name: "split",
                api: $api_ref,
                web: $web_ref,
                compatibility: $compatibility
              }]
            }' >release-manifest.json
          jq -e '
            . as $root |
            .schema_version == 1 and
            (.version | test("^v[0-9]+\\.[0-9]+\\.[0-9]+")) and
            (.revision | test("^[0-9a-f]{40}$")) and
            (.compatibility | test("^openapi-sha256:[0-9a-f]{64}$")) and
            ((.images | keys) == ["api", "web"]) and
            ([.images.api, .images.web] | all(
              (.version == $root.version) and
              (.revision == $root.revision) and
              (.compatibility == $root.compatibility) and
              (.digest | test("^sha256:[0-9a-f]{64}$")) and
              (.reference == (.name + "@" + .digest))
            )) and
            (.compatible_pairs | length == 1) and
            (.compatible_pairs[0].api == .images.api.reference) and
            (.compatible_pairs[0].web == .images.web.reference) and
            (.compatible_pairs[0].compatibility == .compatibility)
          ' release-manifest.json >/dev/null
          sha256sum release-manifest.json >release-manifest.json.sha256
      - name: Attest API image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.api_name }}
          subject-digest: ${{ steps.publish.outputs.api_digest }}
          push-to-registry: true
      - name: Attest web image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.web_name }}
          subject-digest: ${{ steps.publish.outputs.web_digest }}
          push-to-registry: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-manifest.json
          release-manifest.json.sha256
          release-api-sbom.spdx.json#api-sbom.spdx.json
          release-web-sbom.spdx.json#web-sbom.spdx.json
          --verify-tag
          --generate-notes
          --title "Alert Hub ${GITHUB_REF_NAME}"
