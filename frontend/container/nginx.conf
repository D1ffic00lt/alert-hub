worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    upstream alert_hub_api {
        # The API keeps this address across independent container recreation.
        server alert-hub:8080;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        client_max_body_size 1m;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https: wss:; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;

        location = /_api_ready {
            internal;
            proxy_pass http://alert_hub_api/health/ready;
            proxy_http_version 1.1;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        location @api_unavailable {
            default_type application/json;
            return 503 '{"detail":"API unavailable"}';
        }

        location = /api/v1/stream {
            proxy_pass http://alert_hub_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @api_unavailable;
        }

        location ~ ^/(?:api|ingest|internal)/ {
            proxy_pass http://alert_hub_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @api_unavailable;
        }

        location ~ ^/(?:health|metrics)(?:/|$) {
            proxy_pass http://alert_hub_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @api_unavailable;
        }

        location = /runtime-config.js {
            auth_request /_api_ready;
            error_page 500 502 503 504 =503 @api_unavailable;
            alias /run/alert-hub/ui/runtime-config.js;
            default_type application/javascript;
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https: wss:; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options DENY always;
        }

        location = /manifest.webmanifest {
            auth_request /_api_ready;
            error_page 500 502 503 504 =503 @api_unavailable;
            alias /run/alert-hub/ui/manifest.webmanifest;
            default_type application/manifest+json;
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https: wss:; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options DENY always;
        }

        location = /sw.js {
            auth_request /_api_ready;
            error_page 500 502 503 504 =503 @api_unavailable;
            try_files /sw.js =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https: wss:; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
            add_header Service-Worker-Allowed "/" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options DENY always;
        }

        location ~* ^/assets/.+\.(?:css|js|woff2?|png|svg)$ {
            auth_request /_api_ready;
            error_page 500 502 503 504 =503 @api_unavailable;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https: wss:; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options DENY always;
        }

        location / {
            auth_request /_api_ready;
            error_page 500 502 503 504 =503 @api_unavailable;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https: wss:; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options DENY always;
        }
    }
}
