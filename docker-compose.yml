name: alert-hub

services:
  alert-hub:
    image: ${ALERT_HUB_API_IMAGE:-alert-hub-api:dev}
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
        BUILD_CREATED: ${BUILD_CREATED:-unknown}
        BUILD_COMPATIBILITY: ${BUILD_COMPATIBILITY:-dev}
    restart: ${ALERT_HUB_RESTART_POLICY:-unless-stopped}
    env_file:
      - ${ALERT_HUB_ENV_FILE:-.env}
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8080"
      DATABASE_URL: sqlite:////data/alert-hub.db
      UI_ENABLED: "false"
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      TRUSTED_PROXY_CIDRS: "127.0.0.0/8,::1/128,${ALERT_HUB_WEB_IP:-10.254.240.3}/32"
    volumes:
      - type: volume
        source: alert-hub-data
        target: /data
      - type: bind
        source: ${ALERT_HUB_SECRETS_DIR:-./runtime/secrets}
        target: /run/secrets
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      edge:
        ipv4_address: ${ALERT_HUB_API_IP:-10.254.240.2}
      egress: {}

  alert-hub-web:
    image: ${ALERT_HUB_WEB_IMAGE:-alert-hub-web:dev}
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
        BUILD_CREATED: ${BUILD_CREATED:-unknown}
        BUILD_COMPATIBILITY: ${BUILD_COMPATIBILITY:-dev}
    restart: ${ALERT_HUB_RESTART_POLICY:-unless-stopped}
    environment:
      APP_NAME: ${APP_NAME:-Alert Hub}
    depends_on:
      alert-hub:
        condition: service_healthy
    ports:
      - "${ALERT_HUB_BIND_ADDRESS:-127.0.0.1}:${ALERT_HUB_HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=101,gid=101,mode=0700
      - /run/alert-hub:rw,noexec,nosuid,nodev,size=4m,uid=101,gid=101,mode=0755
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -T 2 -t 1 -O /dev/null http://127.0.0.1:8080/health/ready &&
          wget -q -T 2 -t 1 -O /dev/null http://127.0.0.1:8080/ &&
          wget -q -T 2 -t 1 -O /dev/null http://127.0.0.1:8080/runtime-config.js
      interval: 10s
      timeout: 7s
      start_period: 10s
      retries: 3
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      edge:
        ipv4_address: ${ALERT_HUB_WEB_IP:-10.254.240.3}
      ingress: {}

networks:
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${ALERT_HUB_EDGE_SUBNET:-10.254.240.0/29}
  # API workers need bounded outbound provider, monitoring, peer, and registry
  # connectivity. The web image is intentionally absent from this network.
  egress: {}
  # Only the web proxy joins this non-internal bridge so Docker can publish its
  # loopback port while API traffic remains isolated on edge.
  ingress: {}

volumes:
  alert-hub-data:
    name: ${ALERT_HUB_DATA_VOLUME:-alert-hub-data}
